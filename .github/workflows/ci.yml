# Confere cada PR e cada push na main antes de qualquer coisa ir pro ar:
#   backend   testes (pytest) e falhas conhecidas nas dependências Python (pip-audit)
#   frontend  build e falhas conhecidas nas dependências do npm (npm audit)
#   docker    a imagem da API monta (é ela que vai pra hospedagem)
# Ligue "Require status checks to pass" na proteção da main pra o merge esperar o CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # a mesma do Dockerfile
          cache: pip
      - name: Dependências
        run: pip install -r requirements.txt
      - name: Testes
        working-directory: app
        env:
          # Os testes usam mocks e nunca abrem o banco; as variáveis só precisam existir
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET_KEY: segredo-so-do-ci-${{ github.run_id }}-0123456789abcdef
        run: pytest -q
      - name: Falhas conhecidas nas dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

  banco:
    # Um Postgres 16 de verdade: o banco nasce do zero como na primeira subida do
    # contêiner, o Alembic confere que os modelos batem com as migrações e o teste
    # de isolamento entre escolas (que nos testes comuns é pulado) roda pra valer.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: first2work_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d first2work_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/first2work_ci
      FIRST2WORK_TEST_DB: postgresql://ci:ci@localhost:5432/first2work_ci
      JWT_SECRET_KEY: segredo-so-do-ci-${{ github.run_id }}-0123456789abcdef
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r ../requirements.txt
      - name: Banco do zero (como na 1ª subida do contêiner)
        run: python preparar_banco.py
      - name: Modelos batem com as migrações
        run: alembic check
      - name: Dados de teste (seed)
        run: python seed.py
      - name: Isolamento entre escolas num Postgres real
        run: pytest -q test_multiescola.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - name: Build (modo demonstração, com a CSP)
        run: npm run build
      - name: Falhas conhecidas nas dependências (npm audit)
        run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Imagem da API monta
        run: docker build -t first2work-api:ci .
