# Backend + Postgres pra rodar o sistema completo numa máquina (homologação/piloto).
#
#   cp app/.env.example app/.env   # preencha JWT_SECRET_KEY, ADMIN_SENHA, GEMINI_API_KEY, CORS_ORIGINS
#   docker compose up -d --build
#
# A API sobe em http://localhost:8000 e aplica as migrações sozinha.
# Portas incomuns por padrão (5433 e 8000) pra não brigar com outros projetos.
services:
  banco:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: play2work
      POSTGRES_USER: play2work
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-troque-esta-senha}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U play2work -d play2work"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: app/.env
    environment:
      DATABASE_URL: postgresql://play2work:${POSTGRES_PASSWORD:-troque-esta-senha}@banco:5432/play2work
    depends_on:
      banco:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  dados_postgres:
